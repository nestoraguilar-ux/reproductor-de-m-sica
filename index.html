<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Musica</title>
    <link rel="stylesheet"href="styles.css"/>
    <link rel="icon" href="img/play.jpg" type="image/x-icon"/>
</head>
<body>
    <section class="reproductor-musica">
        <h1>Titulo</h1>
        <p>Nombre</p>
        <audio id="cancion">
            <source src="" type="audio/mpeg">
        </audio>
        <input type="range" value="0" id="progreso"/>
        <div class="controles">
            <button class="atras control">
                <i class="bi bi-skip-start-btn"></i>
            </button>
            <button class="boton-reproducir-pausar iconoControl">
                <i class="bi bi-play-btn" id="iconoControl"></i>
            </button>
            <button class="adelante control">
                <i class="bi bi-skip-forward-btn"></i>
            </button>
        </div>
    </section>


    <script src="app.js"></script>
</body>
</html>
